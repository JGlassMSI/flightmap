[project]
name = "flightmap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeff Glass", email = "glass.jeffrey@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[project.scripts]
flightmap = "flightmap:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "osmtilecalc>=1.0.0",
]
